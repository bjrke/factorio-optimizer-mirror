kotlin.code.style=official
kotlin.js.generate.executable.default=false
org.gradle.java.installations.auto-download=false
kotlin.daemon.jvmargs=-Xmx4g
# The Gradle daemon needs more than its 512 MiB/384 MiB defaults: the Kotlin
# Multiplatform plugins, detekt and Spotless exhaust the default metaspace, so
# the daemon expires after every build.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g
# Local builds reuse task results; CI passes -PCI to keep every task executing
# (see the `isCi` block in build.gradle.kts) and only lets `buildSrc` be cached.
org.gradle.caching=true
# Reuses the configuration instead of re-reading build scripts and resolving
# plugins, including across commits: no task result is reused by it.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
