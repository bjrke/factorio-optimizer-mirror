cache:
  paths:
    - .gradle

test:
  stage: test
  image: $CI_REGISTRY_IMAGE:latest
  variables:
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  script:
    - gradle --no-daemon clean check jsBrowserDistribution
    # The root `check` drives buildSrc only up to `jar`, which skips its `check`.
    - gradle --no-daemon -p buildSrc test
  artifacts:
    expire_in: 1 week
    paths:
      - build/dist/js/productionExecutable

pages:
  stage: deploy
  image: alpine:latest
  script:
    - mv build/dist/js/productionExecutable public
  artifacts:
    expire_in: 1 week
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

docker-image:
  stage: .pre
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:latest" ci
    - docker push "$CI_REGISTRY_IMAGE:latest"
  after_script:
    - docker logout
  when: manual
