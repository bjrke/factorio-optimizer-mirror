# Gradle keeps its dependency cache in the workspace so GitLab can cache it. The
# key follows the two files `cache:key:files` allows: the version catalog (Kotlin,
# detekt, Spotless, kotlinx, the wrappers BOM) and this file, whose `cache.paths`
# *are* the layout. This file is in the list on purpose: without it a change to the
# cached paths would keep the key, and a pipeline still running an older path list
# would overwrite the archive without `.gradle/configuration-cache`, discarding the
# entry for everyone on that key. `ci/Dockerfile` gave up its slot for it, because
# two is the maximum: the Gradle version that image pins is already named by the
# `.gradle/caches/9.8.1/transforms` path in `cache.paths`, and any other toolchain
# change needs a manual image build either way. `build.gradle.kts` and
# `buildSrc/build.gradle.kts` are not listed: they do not change the resolved
# artifacts unless the catalog does.
#
# CI keeps every task executing: `-PCI` makes build.gradle.kts opt the application
# build out of the build cache, and `.gradle/9.8.1` (the task history that drives
# up-to-date checks) is deliberately not cached. Only `buildSrc` - build logic,
# never part of the product - and the configuration cache are reused, so the cache
# carries `buildSrc/build` with its own `.gradle` (task history) and
# `.gradle/caches/build-cache-1`, plus `.gradle/configuration-cache`. The buildSrc
# state has to be restored as a unit: rebuilding buildSrc invalidates the
# configuration cache entry even when the jar is byte-identical.
#
# `build/js/node_modules` is cached so the Yarn install only has to validate the
# restored tree; the zip cache keeps its symlinks. There is no `cache:archive`
# keyword: GitLab rejects the config with `cache config contains unknown keys:
# archive`, and the default archive is a zip either way.
variables:
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  # Applies to `buildSrc` too: included builds do not necessarily inherit the root
  # `gradle.properties`, and `gradle.properties` is where local builds enable it.
  GRADLE_OPTS: "-Dorg.gradle.caching=true"

test:
  stage: test
  # The cache belongs to this job alone: `pages` and `docker-image` never run
  # Gradle, and a job that restores and re-uploads an archive it did not write
  # only pays for 22k files. Everything the Kotlin/JS plugin fetches itself is
  # here too, Node included: `.gradle/nodejs` is its 202 MiB distribution, and a
  # checkout that misses it downloads the same version again.
  cache:
    key:
      files:
        - gradle/libs.versions.toml
        - .gitlab-ci.yml
    paths:
      - .gradle/caches/modules-2
      - .gradle/caches/jars-9
      - .gradle/caches/9.8.1/transforms
      - .gradle/caches/build-cache-1
      - .gradle/configuration-cache
      - .gradle/nodejs
      - .gradle/yarn
      - .kotlin
      - buildSrc/build
      - buildSrc/.gradle
      - build/js/node_modules
  # The instance allows only `always` (`allowed_pull_policies`), so the image is
  # pulled once per pipeline even though it only changes with `ci/Dockerfile`.
  image: $CI_REGISTRY_IMAGE:latest
  script:
    # `-Pkotlin.incremental.*=false`: a clean build never reuses incremental state,
    # so only its bookkeeping cost remains. `-Pkotlin.compiler.execution.strategy=in-process`
    # skips the Kotlin daemon JVM, which a one-build container never amortizes.
    # `--max-workers=1` keeps the job strictly serial: tasks never overlap, so the
    # CPU minutes match the work done instead of the runner's core count, which also
    # stops being a configuration cache input.
    - gradle --no-daemon --max-workers=1 -PCI -Pkotlin.incremental=false -Pkotlin.incremental.js=false -Pkotlin.compiler.execution.strategy=in-process check jsBrowserDistribution
    - mv build/dist/js/productionExecutable public
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - public
      - build/reports/tests
      - build/test-results
      - build/reports/detekt
      - build/reports/problems
    reports:
      junit:
        - build/test-results/jvmTest/*.xml
        - build/test-results/jsBrowserTest/*.xml

pages:
  stage: deploy
  image: alpine:latest
  script:
    - "true"
  artifacts:
    expire_in: 1 week
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

docker-image:
  stage: .pre
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:latest" ci
    - docker push "$CI_REGISTRY_IMAGE:latest"
  after_script:
    - docker logout
  when: manual
