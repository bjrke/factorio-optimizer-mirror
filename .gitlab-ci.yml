cache:
  paths:
    - .gradle

test:
  stage: test
  image: java:8-jdk
  variables:
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  script:
    - ./gradlew --no-daemon clean check browserDistribution
  artifacts:
    expire_in: 1 week
    paths:
      - build/distributions

pages:
  stage: deploy
  image: alpine:latest
  script:
    - mv build/distributions public
  artifacts:
    expire_in: 1 week
    paths:
      - public
  only:
    - master
