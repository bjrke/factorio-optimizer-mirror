cache:
  paths:
    - .gradle

test:
  stage: test
  image: registry.gitlab.com/bjrke/docker-gradle-chrome:latest
  variables:
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  script:
    - gradle --no-daemon clean check jsBrowserDistribution
  artifacts:
    expire_in: 1 week
    paths:
      - build/dist/js/productionExecutable

pages:
  stage: deploy
  image: alpine:latest
  script:
    - mv build/dist/js/productionExecutable public
  artifacts:
    expire_in: 1 week
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
