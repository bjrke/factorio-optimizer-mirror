cache:
  paths:
    - .gradle

test:
  stage: test
  image: gradle:7.4.0-jdk17
  variables:
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  script:
    - gradle --no-daemon clean check jsBrowserDistribution
  artifacts:
    expire_in: 1 week
    paths:
      - build/distributions

pages:
  stage: deploy
  image: alpine:latest
  script:
    - mv build/distributions public
  artifacts:
    expire_in: 1 week
    paths:
      - public
  only:
    - master
