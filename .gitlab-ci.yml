cache:
  paths:
    - .gradle

test:
  stage: test
  image: gradle:8.5-jdk17
  variables:
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  script:
    - gradle --no-daemon clean check jsBrowserDistribution -x jsBrowserTest
  artifacts:
    expire_in: 1 week
    paths:
      - build/dist/js/productionExecutable

pages:
  stage: deploy
  image: alpine:latest
  script:
    - mv build/dist/js/productionExecutable public
  artifacts:
    expire_in: 1 week
    paths:
      - public
  only:
    - main
