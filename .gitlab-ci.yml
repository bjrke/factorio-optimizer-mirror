# Gradle keeps its dependency cache in the workspace so GitLab can cache it. The
# key follows the two files that pin every dependency: the version catalog (Kotlin,
# detekt, Spotless, kotlinx, the wrappers BOM) and the `Dockerfile` (its image tag
# pins the Gradle and JDK versions, and so the cache layout). GitLab allows two
# `key:files` entries, so `build.gradle.kts` and `buildSrc/build.gradle.kts` cannot
# be listed too; they do not change the resolved artifacts unless the catalog does.
variables:
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  GRADLE_OPTS: "-Dorg.gradle.caching=true"

cache:
  key:
    files:
      - gradle/libs.versions.toml
      - Dockerfile
  paths:
    - .gradle/caches/modules-2
    - .gradle/caches/jars-9
    - .gradle/caches/9.8.1/transforms
    - .kotlin
    - build/js/node_modules

test:
  stage: test
  image: $CI_REGISTRY_IMAGE:latest
  script:
    - gradle --no-daemon check jsBrowserDistribution
    - mv build/dist/js/productionExecutable public
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - public
      - build/reports/tests
      - build/test-results
      - build/reports/detekt
      - build/reports/problems
    reports:
      junit:
        - build/test-results/jvmTest/*.xml
        - build/test-results/jsBrowserTest/*.xml

pages:
  stage: deploy
  image: alpine:latest
  script:
    - "true"
  artifacts:
    expire_in: 1 week
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

docker-image:
  stage: .pre
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:latest" ci
    - docker push "$CI_REGISTRY_IMAGE:latest"
  after_script:
    - docker logout
  when: manual
