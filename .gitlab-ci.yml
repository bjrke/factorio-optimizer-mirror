stages:
  - build
  - test
  - deploy

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle

.docker-build:
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  after_script:
    - docker logout $CI_REGISTRY

.gradle-test:
  variables:
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  script:
    - gradle --no-daemon clean check jsBrowserDistribution
  artifacts:
    expire_in: 1 week
    paths:
      - build/dist/js/productionExecutable

# Builds and publishes the shared :latest image. Only runs on main, so a
# Dockerfile change on a feature branch can never clobber the image everyone
# else's tests pull.
build-image:
  extends: .docker-build
  stage: build
  script:
    - docker build --pull -t $CI_REGISTRY_IMAGE:latest ci/
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:        # rebuild automatically only when the image definition changes
        - ci/Dockerfile
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual     # manual override for on-demand rebuilds on main

# Builds a branch-scoped image (never :latest) when a non-main branch touches
# the Dockerfile, so that branch's tests can use it directly without
# affecting main.
build-image-branch:
  extends: .docker-build
  stage: build
  script:
    - docker build --pull -t $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG ci/
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  rules:
    - if: '$CI_COMMIT_BRANCH != "main"'
      changes:
        - ci/Dockerfile
    - if: '$CI_COMMIT_BRANCH != "main"'
      when: manual     # manual override for on-demand rebuilds of this branch's image

# Normal case: test against the shared :latest image (on main, this is the
# freshly-pushed image if build-image just ran).
test:
  extends: .gradle-test
  stage: test
  image: $CI_REGISTRY_IMAGE:latest
  rules:
    - if: '$CI_COMMIT_BRANCH != "main"'
      changes:
        - ci/Dockerfile
      when: never   # handled by test-with-branch-image instead
    - when: on_success

# Only when a non-main branch changes the Dockerfile: test against the
# branch-scoped image built above, instead of :latest.
test-with-branch-image:
  extends: .gradle-test
  stage: test
  image: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  needs:
    - build-image-branch
  rules:
    - if: '$CI_COMMIT_BRANCH != "main"'
      changes:
        - ci/Dockerfile

pages:
  stage: deploy
  image: alpine:latest
  script:
    - mv build/dist/js/productionExecutable public
  artifacts:
    expire_in: 1 week
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

