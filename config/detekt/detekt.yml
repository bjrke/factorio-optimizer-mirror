# Overrides on top of detekt's default config (see `buildUponDefaultConfig` in
# build.gradle.kts). The default rule set is kept; only the budgets this project
# cares about are adjusted here.
complexity:
  # This project keeps a source file under 500 lines; a class that outgrows it is
  # the signal to split the file.
  LargeClass:
    allowedLines: 500

style:
  # The optimizer is geometry- and math-heavy: tile offsets, degrees and game data
  # read better in place, and tests need the expected number next to the assertion.
  # Semantic mappings (directions, rotations) use named model properties instead.
  MagicNumber:
    active: false
