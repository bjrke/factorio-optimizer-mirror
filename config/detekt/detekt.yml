# Overrides on top of detekt's default config (see `buildUponDefaultConfig` in
# build.gradle.kts). The default rule set is kept; only the budgets this project
# cares about are adjusted here.
complexity:
  # This project keeps a source file under 500 lines; a class that outgrows it is
  # the signal to split the file.
  LargeClass:
    allowedLines: 500

style:
  # The optimizer is geometry- and math-heavy: tile offsets, degrees and game data
  # read better in place, and tests need the expected number next to the assertion.
  # Semantic mappings (directions, rotations) use named model properties instead.
  MagicNumber:
    active: false

  # Search and geometry helpers reject a case and return early; the guard clauses
  # are the readable form. Functions with more exits than that stay in the baseline.
  ReturnCount:
    excludeGuardClauses: true

  # A* and parser loops skip several candidate cases with `continue`. Three jumps
  # is the readable ceiling; the messier loops stay in the baseline.
  LoopWithTooManyJumpStatements:
    maxJumpCount: 3

  # Four named values in a test case (belt, lanes, stack, expected) still read as a
  # statement; five or more are a sign the table row should be a data class.
  DestructuringDeclarationWithTooManyEntries:
    maxDestructuringEntries: 4

  # The project's own packages are imported name by name: an edge that is a wildcard is
  # invisible to the boundary rules below, which only see explicit imports (see
  # `knowledge/decisions.md`, 2026-10-21). The serialization DSL is different: JSON code
  # is a separate layer that reads as one vocabulary. Standard-library and third-party
  # wildcards are still allowed.
  WildcardImport:
    excludeImports:
      - 'java.util.*'
      - 'kotlinx.serialization.json.*'
      - 'kotlin.test.*'
      - 'de.bjrke.test.*'

  # Package edges (see `knowledge/decisions.md`, 2026-10-21). The rule is on and
  # the list is empty on purpose: detekt 2.0.0-alpha.6 cannot express this
  # pipeline's edges. `allowedImports` is a single global list, and every
  # `forbiddenImports` entry applies to *every* file, so a package can only be
  # listed when no other package may import it. Here the builder imports every
  # stage, the stages import each other through the shared vocabulary
  # (`layout`, `plan`, `route`), and the drivers and tests import the read-back
  # packages, so no package qualifies: measured, every `pkg.**` entry either
  # forbids an allowed edge or is unreachable. The edges stay enforced by the
  # compiler (`internal` symbols) and by review. If detekt ever grows per-package
  # permission, the intended edges are listed in `knowledge/decisions.md`.
  ForbiddenImport:
    active: true
    forbiddenImports: []
