<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Factorio Optimizer</title>
    <link rel="icon" type="image/png" href="icons/assembling-machine-3.png">
    <style>
        /* Light theme; the dark (Factorio-flavored) overrides follow in the media query. The
           same token names are read by the emotion styles in the Kotlin components. */
        :root {
            color-scheme: light dark;
            --bg: #fff;
            --fg: #000;
            --border: #787878;
            --input-border: #999;
            --dropdown-bg: #fff;
            --dropdown-border: #888;
            --highlight: #8fb8ff;
            --highlight-fg: #000;
            --muted: #888;
            --link: #0000ee;
            --factory-tint: 70%;
            --factory-panel: #fff;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #313131;
                --fg: #e6e6e6;
                --border: #5a5a5a;
                --input-border: #6b6b6b;
                --dropdown-bg: #3a3a3a;
                --dropdown-border: #555;
                --highlight: #b5731f;
                --highlight-fg: #1a1a1a;
                --muted: #a0a0a0;
                --link: #f0a93a;
                --factory-tint: 35%;
                --factory-panel: #262626;
            }
        }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex; flex-direction: column;
            background: var(--bg); color: var(--fg);
        }
        a { color: var(--link); }
        .app-root { position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
        .app-layout { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
        .app-header {
            display: flex; align-items: center; flex-shrink: 0; flex-wrap: wrap;
            padding-left: 8px;
        }
        .app-header > div { display: contents; }
        .app-content { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
        .footer {
            flex-shrink: 0;
            display: flex; align-items: center; flex-wrap: wrap; gap: .35rem;
            padding: 2px 8px; font-size: .85em;
        }
        .footer img { vertical-align: middle; }
        .footer-license { font: inherit; color: var(--link); background: none; border: none; padding: 0; cursor: pointer; }
        .license-overlay {
            position: fixed; inset: 0; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, .5);
        }
        .license-dialog {
            max-width: min(48rem, 90vw); max-height: 80vh; overflow-y: auto;
            padding: 1rem; border: 1px solid var(--border); border-radius: 6px;
            background: var(--dropdown-bg); color: var(--fg);
        }
        .license-dialog pre { margin: 0; white-space: pre-wrap; font: inherit; }
        .license-close { float: right; }
        /* The blueprint dialog fills the app area (everything above the footer); the preview inside
           scales the plan down to whatever room is left. */
        .blueprint-overlay {
            position: absolute; inset: 0; z-index: 100;
            display: flex; align-items: stretch; justify-content: stretch;
            background: rgba(0, 0, 0, .5);
        }
        .blueprint-dialog {
            flex: 1 1 auto; min-width: 0; min-height: 0;
            box-sizing: border-box; display: flex; flex-direction: column; gap: .5rem;
            padding: .75rem;
            background: var(--dropdown-bg); color: var(--fg);
        }
        .blueprint-toolbar { display: flex; align-items: center; gap: .5rem; flex-shrink: 0; }
        .blueprint-label { margin-right: auto; font-weight: bold; }
        .blueprint-string { width: 100%; height: 4rem; box-sizing: border-box; font: inherit; }
        .blueprint-preview { flex: 1 1 auto; min-height: 0; display: flex; overflow: hidden; }
        .material-selector { position: relative; display: inline-block; margin-right: 2px; }
        .material-selector-input {
            width: 16rem; height: 2.5rem; box-sizing: border-box;
            padding-left: 2.5rem; font: inherit; color: inherit;
            background: var(--bg);
            border: 1px solid var(--input-border); border-radius: 4px;
        }
        .material-selector-input::placeholder { color: inherit; opacity: 1; }
        .material-selector .material-selector-icon {
            position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
            margin: 0; pointer-events: none;
        }
        .material-selector-dropdown {
            position: absolute; z-index: 10; top: 100%; left: 0; min-width: 100%;
            max-height: 20rem; overflow-y: auto;
            background: var(--dropdown-bg); border: 1px solid var(--dropdown-border);
            box-shadow: 0 2px 6px rgba(0,0,0,.3);
        }
        .material-selector-empty { padding: .2rem .4rem; color: var(--muted); }
        .material-selector-option {
            display: flex; align-items: center; gap: .35rem;
            padding: .2rem .4rem; white-space: nowrap; cursor: pointer;
        }
        .material-selector-option.highlighted {
            background: var(--highlight); color: var(--highlight-fg);
        }
        .icon-option {
            display: inline-flex; align-items: center;
            padding: 6px; margin: 2px; border-radius: 6px; cursor: pointer;
            user-select: none; background: transparent;
        }
        .icon-option.selected { background: var(--highlight); }
        .icon-option.disabled { opacity: .4; cursor: not-allowed; }
        .visually-hidden {
            position: absolute; width: 1px; height: 1px;
            padding: 0; margin: -1px; overflow: hidden;
            clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
        }
    </style>
</head>
<body>
    <script src="factorio-optimizer.js"></script>
    <div class="footer" id="footer"></div>
</body>
</html>
