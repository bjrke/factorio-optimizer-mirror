<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Factorio Optimizer</title>
    <link rel="icon" type="image/png" href="icons/assembling-machine-3.png">
    <style>
        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; }
        .app-root { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
        .app-layout { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
        .app-header {
            display: flex; align-items: center; flex-shrink: 0; flex-wrap: wrap;
            padding-left: 8px;
        }
        .app-header > div { display: contents; }
        .app-content { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
        .footer { flex-shrink: 0; }
        .material-selector { position: relative; display: inline-block; margin-right: 2px; }
        .material-selector-input {
            width: 16rem; height: 2.5rem; box-sizing: border-box;
            padding-left: 2.5rem; font: inherit; color: inherit;
            border: 1px solid #999; border-radius: 4px;
        }
        .material-selector-input::placeholder { color: inherit; opacity: 1; }
        .material-selector .material-selector-icon {
            position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
            margin: 0; pointer-events: none;
        }
        .material-selector-dropdown {
            position: absolute; z-index: 10; top: 100%; left: 0; min-width: 100%;
            max-height: 20rem; overflow-y: auto;
            background: #fff; border: 1px solid #888; box-shadow: 0 2px 6px rgba(0,0,0,.3);
        }
        .material-selector-empty { padding: .2rem .4rem; color: #888; }
        .material-selector-option {
            display: flex; align-items: center; gap: .35rem;
            padding: .2rem .4rem; white-space: nowrap; cursor: pointer;
        }
        .material-selector-option.highlighted { background: #8fb8ff; }
        .icon-option {
            display: inline-flex; align-items: center;
            padding: 6px; margin: 2px; border-radius: 6px; cursor: pointer;
            user-select: none; background: transparent;
        }
        .icon-option.selected { background: #8fb8ff; }
        .icon-option.disabled { opacity: .4; cursor: not-allowed; }
        .visually-hidden {
            position: absolute; width: 1px; height: 1px;
            padding: 0; margin: -1px; overflow: hidden;
            clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
        }
    </style>
</head>
<body>
    <script src="factorio-optimizer.js"></script>
    <div class="footer">
        Open-Source: <a href="https://gitlab.com/bjrke/factorio-optimizer" target="_blank">gitlab.com/bjrke/factorio-optimizer</a> |
        License: <a href="https://www.apache.org/licenses/LICENSE-2.0" target="_blank">Apache 2.0</a> |
        Icons and Recipes: ©<a href="https://www.factorio.com/game/about" target="_blank">Wube Software</a>
    </div>
</body>
</html>
